name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --locked

      - name: Lint, format-check and test
        run: make ci

      - name: Generate site
        run: make generate

      - name: Publish rendered resume as release assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          name: Latest resume
          body: |
            Rendered résumé, rebuilt from `resume_data.py` on every push to `master`.

            - [resume.pdf](https://github.com/${{ github.repository }}/releases/latest/download/resume.pdf)
            - [resume.md](https://github.com/${{ github.repository }}/releases/latest/download/resume.md)
          files: |
            public/resume.pdf
            public/resume.md

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'public'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
